<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Eventi — AIA Sezione Valdarno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="../index.html" class="navbar-brand">
    <div class="logo-icon">AIA</div>
    <span>AIA <span class="oro">Valdarno</span></span>
  </a>
  <button class="navbar-toggle" id="navbar-toggle" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <ul class="navbar-nav" id="navbar-nav">
    <li><a href="../index.html">Sito Pubblico</a></li>
    <li data-role="auth" style="display:none;">
      <span data-user-name style="color:var(--grigio);font-size:0.85rem;padding:6px 14px;"></span>
    </li>
    <li data-role="auth" style="display:none;">
      <a href="#" data-action="logout" class="btn btn-secondary btn-sm">Esci</a>
    </li>
  </ul>
</nav>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Pannello</div>
      <ul class="sidebar-nav">
        <li><a href="../admin/dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
      </ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Gestione</div>
      <ul class="sidebar-nav">
        <li><a href="../admin/eventi.html" class="active"><span class="icon">📅</span> Eventi</a></li>
        <li><a href="../admin/utenti.html"><span class="icon">👥</span> Utenti</a></li>
      </ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Navigazione</div>
      <ul class="sidebar-nav">
        <li><a href="../calendario.html"><span class="icon">🗓️</span> Calendario Pubblico</a></li>
        <li><a href="../index.html"><span class="icon">🏠</span> Homepage</a></li>
      </ul>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1>Gestione Eventi</h1>
        <p>Crea, modifica ed elimina gli eventi della sezione</p>
      </div>
      <button class="btn btn-primary" id="btn-nuovo-evento">+ Nuovo Evento</button>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <select id="filter-tipo">
        <option value="">Tutti i tipi</option>
        <option value="Raduno">Raduno</option>
        <option value="RTO">RTO</option>
        <option value="Corso">Corso</option>
        <option value="Partita">Partita</option>
        <option value="Altro">Altro</option>
      </select>
      <input type="month" id="filter-mese" title="Filtra per mese">
      <button class="btn btn-secondary btn-sm" id="btn-reset-filter">Azzera filtri</button>
      <span id="eventi-count" style="color:var(--grigio);font-size:0.85rem;margin-left:auto;"></span>
    </div>

    <!-- Alert -->
    <div id="page-alert" class="alert" style="display:none; margin-bottom:16px;"></div>

    <!-- Lista eventi -->
    <div id="eventi-list">
      <div class="loading"><div class="spinner"></div><span>Caricamento eventi...</span></div>
    </div>
  </main>
</div>

<!-- Modal Evento -->
<div class="modal-overlay" id="evento-modal">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3 id="modal-title">Nuovo Evento</h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div id="modal-error" class="alert alert-error" style="display:none;"></div>
    <form id="evento-form">
      <input type="hidden" id="evento-id">
      <div class="form-group">
        <label>Titolo *</label>
        <input type="text" id="ef-title" required placeholder="Es. Raduno mensile sezione">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group">
          <label>Data *</label>
          <input type="date" id="ef-date" required>
        </div>
        <div class="form-group">
          <label>Ora</label>
          <input type="time" id="ef-time">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group">
          <label>Tipo</label>
          <select id="ef-type">
            <option value="Raduno">Raduno</option>
            <option value="RTO">RTO</option>
            <option value="Corso">Corso</option>
            <option value="Partita">Partita</option>
            <option value="Altro">Altro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Visibile a</label>
          <select id="ef-visibile">
            <option value="tutti">Tutti</option>
            <option value="arbitri">Arbitri</option>
            <option value="admin">Solo Admin</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Note</label>
        <textarea id="ef-notes" placeholder="Note aggiuntive sull'evento..."></textarea>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px;">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Annulla</button>
        <button type="submit" class="btn btn-primary" id="modal-submit">Crea Evento</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { requireRole, initNavbar } from '/js/auth.js';
  import { loadEventi, creaEvento, aggiornaEvento, eliminaEvento } from '/js/admin.js';

  const TIPO_BADGE = { Raduno:'badge-blue', RTO:'badge-green', Corso:'badge-orange', Partita:'badge-red', Altro:'badge-gray' };
  const MESI_IT = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

  let currentFiltri = {};

  async function init() {
    await requireRole(['superadmin', 'admin']);
    await initNavbar();
    await renderEventi();
    setupModal();
    setupFilters();
  }

  async function renderEventi() {
    const listEl = document.getElementById('eventi-list');
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div><span>Caricamento...</span></div>';

    const eventi = await loadEventi(currentFiltri);
    document.getElementById('eventi-count').textContent = `${eventi.length} event${eventi.length === 1 ? 'o' : 'i'}`;

    if (eventi.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Nessun evento trovato con i filtri selezionati.</p></div>';
      return;
    }

    listEl.innerHTML = eventi.map(e => {
      const d = new Date(e.date + 'T00:00:00');
      const day = d.getDate();
      const month = MESI_IT[d.getMonth()];
      return `
        <div class="event-row">
          <div class="event-date-block">
            <div class="day">${day}</div>
            <div class="month">${month}</div>
          </div>
          <div class="event-info">
            <h4>${e.title}</h4>
            <p>${e.time ? `⏰ ${e.time}` : ''}${e.time && e.notes ? ' — ' : ''}${e.notes || ''}</p>
          </div>
          <span class="badge ${TIPO_BADGE[e.type] || 'badge-gray'}">${e.type}</span>
          <span class="badge ${e.visibile_a === 'tutti' ? 'badge-green' : e.visibile_a === 'arbitri' ? 'badge-blue' : 'badge-gray'}">${e.visibile_a}</span>
          <div class="event-actions">
            <button class="btn btn-sm btn-secondary" data-action="edit" data-id="${e.id}">✏️</button>
            <button class="btn btn-sm btn-danger" data-action="delete" data-id="${e.id}">🗑️</button>
          </div>
        </div>
      `;
    }).join('');

    // Azioni
    listEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const event = eventi.find(e => e.id === btn.dataset.id);
        openModal(event);
      });
    });
    listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Eliminare questo evento? L\'azione non può essere annullata.')) return;
        const { error } = await eliminaEvento(btn.dataset.id);
        if (error) {
          showAlert('Errore eliminazione: ' + error, 'alert-error');
        } else {
          showAlert('Evento eliminato.', 'alert-success');
          await renderEventi();
        }
      });
    });
  }

  function setupFilters() {
    document.getElementById('filter-tipo').addEventListener('change', async e => {
      currentFiltri.tipo = e.target.value || undefined;
      await renderEventi();
    });
    document.getElementById('filter-mese').addEventListener('change', async e => {
      currentFiltri.mese = e.target.value || undefined;
      await renderEventi();
    });
    document.getElementById('btn-reset-filter').addEventListener('click', async () => {
      currentFiltri = {};
      document.getElementById('filter-tipo').value = '';
      document.getElementById('filter-mese').value = '';
      await renderEventi();
    });
  }

  function setupModal() {
    const modal = document.getElementById('evento-modal');
    const form = document.getElementById('evento-form');

    document.getElementById('btn-nuovo-evento').addEventListener('click', () => openModal(null));
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const errorEl = document.getElementById('modal-error');
      errorEl.style.display = 'none';

      const id = document.getElementById('evento-id').value;
      const payload = {
        title: document.getElementById('ef-title').value.trim(),
        date: document.getElementById('ef-date').value,
        time: document.getElementById('ef-time').value || null,
        type: document.getElementById('ef-type').value,
        visibile_a: document.getElementById('ef-visibile').value,
        notes: document.getElementById('ef-notes').value.trim() || null,
      };

      const submitBtn = document.getElementById('modal-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Salvataggio...';

      let error;
      if (id) {
        ({ error } = await aggiornaEvento(id, payload));
      } else {
        ({ error } = await creaEvento(payload));
      }

      submitBtn.disabled = false;
      submitBtn.textContent = id ? 'Salva Modifiche' : 'Crea Evento';

      if (error) {
        errorEl.textContent = error;
        errorEl.style.display = 'block';
      } else {
        closeModal();
        showAlert(id ? 'Evento aggiornato.' : 'Evento creato e arbitri notificati.', 'alert-success');
        await renderEventi();
      }
    });
  }

  function openModal(event) {
    const modal = document.getElementById('evento-modal');
    const title = document.getElementById('modal-title');
    const submitBtn = document.getElementById('modal-submit');
    document.getElementById('modal-error').style.display = 'none';

    document.getElementById('evento-id').value = event?.id || '';
    document.getElementById('ef-title').value = event?.title || '';
    document.getElementById('ef-date').value = event?.date || '';
    document.getElementById('ef-time').value = event?.time || '';
    document.getElementById('ef-type').value = event?.type || 'Raduno';
    document.getElementById('ef-visibile').value = event?.visibile_a || 'tutti';
    document.getElementById('ef-notes').value = event?.notes || '';

    title.textContent = event ? 'Modifica Evento' : 'Nuovo Evento';
    submitBtn.textContent = event ? 'Salva Modifiche' : 'Crea Evento';

    modal.classList.add('active');
  }

  function closeModal() {
    document.getElementById('evento-modal').classList.remove('active');
  }

  function showAlert(msg, cls) {
    const el = document.getElementById('page-alert');
    el.className = `alert ${cls}`;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  init();
</script>

</body>
</html>
